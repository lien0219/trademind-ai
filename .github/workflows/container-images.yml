name: Container Images

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish deploy/IMAGE_VERSION as a release (main only)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "deploy/IMAGE_VERSION"
      - "backend/**"
      - "admin/**"
      - "collector/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "docker-compose.full.yml"
      - "deploy/production/compose.yml"
      - ".dockerignore"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "scripts/patch-pro-field-antd-select.mjs"
      - "scripts/release/sanitize-trivy-report.mjs"
      - "scripts/release/enforce-image-scan-outcomes.mjs"
      - "scripts/release/verify-image-attestations.mjs"
      - "scripts/release/validate-image-version.sh"
      - "scripts/release/validate-release-version.mjs"
      - "scripts/release/release-version.mjs"
      - ".github/workflows/container-images.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

# Keep production publishing ordered. A completed older run must not move a
# production tag after a newer run has been accepted.
concurrency:
  group: trademind-container-publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: trademind

jobs:
  image_metadata:
    name: Resolve image metadata
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.image.outputs.namespace }}
      version: ${{ steps.image.outputs.version }}
      commit: ${{ steps.image.outputs.commit }}
      publish_release: ${{ steps.image.outputs.publish_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve branch and version
        id: image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE: ${{ inputs.publish_release || false }}
        run: |
          set -Eeuo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" || "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Container image publishing is allowed only from main"
            exit 1
          fi

          version="$(bash scripts/release/validate-image-version.sh)"
          namespace="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$namespace" ]]; then
            echo "::error::Unable to resolve the GHCR namespace"
            exit 1
          fi

          publish_release=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_RELEASE" == "true" ]]; then
            publish_release=true
          elif [[ "$EVENT_NAME" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            if ! git diff --quiet "${{ github.event.before }}" "$GITHUB_SHA" -- deploy/IMAGE_VERSION; then
              publish_release=true
            fi
          fi

          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"

          {
            echo "## Container image metadata"
            echo "- Source ref: \`$GITHUB_REF_NAME\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Image version: \`$version\`"
            echo "- Publish formal release: \`$publish_release\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build ${{ matrix.service }} candidate image
    needs: image_metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            title: TradeMind Backend
            description: TradeMind Go API and background workers
            git_context_suffix: ":backend"
            dockerfile: Dockerfile
          - service: admin
            title: TradeMind Admin
            description: TradeMind React operations workspace
            git_context_suffix: ""
            dockerfile: admin/Dockerfile
          - service: collector
            title: TradeMind Collector
            description: TradeMind Playwright collection service
            git_context_suffix: ""
            dockerfile: collector/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.image_metadata.outputs.commit }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate candidate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.image_metadata.outputs.namespace }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.service }}-sha-${{ needs.image_metadata.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.image_metadata.outputs.commit }}
            org.opencontainers.image.version=${{ needs.image_metadata.outputs.version }}
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/${{ github.repository }}.git#${{ needs.image_metadata.outputs.commit }}${{ matrix.git_context_suffix }}
          file: ${{ matrix.dockerfile }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trademind-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=trademind-${{ matrix.service }}
          provenance: mode=max,version=v1
          sbom: true
          outputs: type=image,oci-mediatypes=true,oci-artifact=true

      - name: Record candidate image digest
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ env.REGISTRY }}/${{ needs.image_metadata.outputs.namespace }}/${{ env.IMAGE_NAME }}:${{ matrix.service }}-sha-${{ needs.image_metadata.outputs.commit }}
        run: |
          set -Eeuo pipefail
          digest="${{ steps.build.outputs.digest }}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p image-metadata
          {
            echo "service=${{ matrix.service }}"
            echo "image=$CANDIDATE_IMAGE"
            echo "digest=$digest"
            echo "revision=${{ needs.image_metadata.outputs.commit }}"
          } > "image-metadata/${{ matrix.service }}.env"

      - name: Upload candidate image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ needs.image_metadata.outputs.commit }}
          path: image-metadata/${{ matrix.service }}.env
          if-no-files-found: error
          retention-days: 7

  scan:
    name: Verify and scan ${{ matrix.service }} image
    needs: [image_metadata, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            source_subdir: backend
            source_path: Dockerfile
          - service: admin
            source_subdir: .
            source_path: admin/Dockerfile
          - service: collector
            source_subdir: .
            source_path: collector/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.image_metadata.outputs.commit }}

      - name: Download candidate image digest
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ needs.image_metadata.outputs.commit }}
          path: image-metadata

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate platforms and source revision
        id: platforms
        shell: bash
        env:
          EXPECTED_SERVICE: ${{ matrix.service }}
          EXPECTED_REVISION: ${{ needs.image_metadata.outputs.commit }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_SUBDIR: ${{ matrix.source_subdir }}
          EXPECTED_SOURCE_PATH: ${{ matrix.source_path }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          file="image-metadata/${EXPECTED_SERVICE}.env"
          test -s "$file"
          grep -qx "service=$EXPECTED_SERVICE" "$file"
          image="$(sed -n 's/^image=//p' "$file")"
          index_digest="$(sed -n 's/^digest=//p' "$file")"
          revision="$(sed -n 's/^revision=//p' "$file")"
          [[ "$image" == "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trademind:${EXPECTED_SERVICE}-sha-${EXPECTED_REVISION}" ]]
          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$revision" == "$EXPECTED_REVISION" ]]
          image="$image@$index_digest"
          raw="$(docker buildx imagetools inspect --raw "$image")"
          amd64_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("expected exactly one linux/amd64 manifest") end' <<<"$raw")"
          arm64_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | if length == 1 then .[0].digest else error("expected exactly one linux/arm64 manifest") end' <<<"$raw")"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          for platform in amd64 arm64; do
            if [[ "$platform" == amd64 ]]; then digest="$amd64_digest"; else digest="$arm64_digest"; fi
            platform_image="${image%@*}@$digest"
            docker pull --platform "linux/$platform" "$platform_image" >/dev/null
            actual_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$platform_image")"
            if [[ "$actual_revision" != "$EXPECTED_REVISION" ]]; then
              echo "::error::OCI revision for linux/$platform does not match the source commit"
              exit 1
            fi
          done

          node scripts/release/verify-image-attestations.mjs "$image" "$EXPECTED_REVISION" "$amd64_digest" "$arm64_digest" "$EXPECTED_REPOSITORY" "$EXPECTED_SOURCE_SUBDIR" "$EXPECTED_SOURCE_PATH"

          echo "image=${image%@*}" >> "$GITHUB_OUTPUT"
          echo "amd64_digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$arm64_digest" >> "$GITHUB_OUTPUT"

      - name: Scan vulnerabilities on linux/amd64
        id: scan_amd64
        if: ${{ !cancelled() && steps.platforms.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.platforms.outputs.image }}@${{ steps.platforms.outputs.amd64_digest }}
          version: v0.76.1
          vuln-type: os,library
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: ${{ runner.temp }}/trivy-amd64-vuln.json

      - name: Scan secrets on linux/amd64
        id: secret_amd64
        if: ${{ !cancelled() && steps.platforms.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.platforms.outputs.image }}@${{ steps.platforms.outputs.amd64_digest }}
          version: v0.76.1
          scanners: secret
          exit-code: "1"
          format: json
          output: ${{ runner.temp }}/trivy-amd64-secret.json

      - name: Scan vulnerabilities on linux/arm64
        id: scan_arm64
        if: ${{ !cancelled() && steps.platforms.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.platforms.outputs.image }}@${{ steps.platforms.outputs.arm64_digest }}
          version: v0.76.1
          vuln-type: os,library
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: ${{ runner.temp }}/trivy-arm64-vuln.json

      - name: Scan secrets on linux/arm64
        id: secret_arm64
        if: ${{ !cancelled() && steps.platforms.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.platforms.outputs.image }}@${{ steps.platforms.outputs.arm64_digest }}
          version: v0.76.1
          scanners: secret
          exit-code: "1"
          format: json
          output: ${{ runner.temp }}/trivy-arm64-secret.json

      - name: Sanitize per-platform security reports
        id: sanitize
        if: ${{ always() && steps.platforms.outcome == 'success' }}
        shell: bash
        env:
          AMD64_VULN_REPORT: ${{ runner.temp }}/trivy-amd64-vuln.json
          AMD64_SECRET_REPORT: ${{ runner.temp }}/trivy-amd64-secret.json
          ARM64_VULN_REPORT: ${{ runner.temp }}/trivy-arm64-vuln.json
          ARM64_SECRET_REPORT: ${{ runner.temp }}/trivy-arm64-secret.json
          AMD64_VULN_OUTCOME: ${{ steps.scan_amd64.outcome }}
          AMD64_SECRET_OUTCOME: ${{ steps.secret_amd64.outcome }}
          ARM64_VULN_OUTCOME: ${{ steps.scan_arm64.outcome }}
          ARM64_SECRET_OUTCOME: ${{ steps.secret_arm64.outcome }}
        run: |
          set -Eeuo pipefail
          trap 'rm -f "$AMD64_VULN_REPORT" "$AMD64_SECRET_REPORT" "$ARM64_VULN_REPORT" "$ARM64_SECRET_REPORT"' EXIT
          mkdir -p image-metadata
          failed=0
          node scripts/release/sanitize-trivy-report.mjs "$AMD64_VULN_REPORT" image-metadata/trivy-amd64-vuln.json "$AMD64_VULN_OUTCOME" || failed=1
          node scripts/release/sanitize-trivy-report.mjs "$AMD64_SECRET_REPORT" image-metadata/trivy-amd64-secret.json "$AMD64_SECRET_OUTCOME" || failed=1
          node scripts/release/sanitize-trivy-report.mjs "$ARM64_VULN_REPORT" image-metadata/trivy-arm64-vuln.json "$ARM64_VULN_OUTCOME" || failed=1
          node scripts/release/sanitize-trivy-report.mjs "$ARM64_SECRET_REPORT" image-metadata/trivy-arm64-secret.json "$ARM64_SECRET_OUTCOME" || failed=1
          if (( failed != 0 )); then
            echo "::error::One or more Trivy reports were unavailable or invalid"
            exit 1
          fi

      - name: Upload sanitized security diagnostics
        if: ${{ always() && steps.platforms.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-${{ needs.image_metadata.outputs.commit }}
          path: |
            image-metadata/trivy-amd64-vuln.json
            image-metadata/trivy-amd64-secret.json
            image-metadata/trivy-arm64-vuln.json
            image-metadata/trivy-arm64-secret.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce all platform security scans
        if: always()
        env:
          PLATFORM_OUTCOME: ${{ steps.platforms.outcome }}
          AMD64_OUTCOME: ${{ steps.scan_amd64.outcome }}
          ARM64_OUTCOME: ${{ steps.scan_arm64.outcome }}
          SECRET_AMD64_OUTCOME: ${{ steps.secret_amd64.outcome }}
          SECRET_ARM64_OUTCOME: ${{ steps.secret_arm64.outcome }}
          SANITIZE_OUTCOME: ${{ steps.sanitize.outcome }}
        run: node scripts/release/enforce-image-scan-outcomes.mjs

  quality_gate:
    name: Main quality gate
    needs: image_metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.image_metadata.outputs.commit }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workflow policy
        run: pnpm workflow:verify

      - name: Build Admin
        run: pnpm build:admin

      - name: Build Collector
        run: pnpm build:collector

      - name: Test and build backend
        working-directory: backend
        run: |
          go test ./...
          go build ./...

  verify:
    name: Verify complete image set
    needs: [image_metadata, publish, scan, quality_gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      backend_digest: ${{ steps.collect.outputs.backend_digest }}
      admin_digest: ${{ steps.collect.outputs.admin_digest }}
      collector_digest: ${{ steps.collect.outputs.collector_digest }}
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-*-${{ needs.image_metadata.outputs.commit }}
          path: image-metadata
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate all image digests
        id: collect
        shell: bash
        env:
          NAMESPACE: ${{ needs.image_metadata.outputs.namespace }}
          COMMIT: ${{ needs.image_metadata.outputs.commit }}
        run: |
          set -Eeuo pipefail
          for service in backend admin collector; do
            file="image-metadata/$service.env"
            test -s "$file" || { echo "::error::Missing digest record for $service"; exit 1; }
            grep -q "^service=$service$" "$file"
            digest="$(sed -n 's/^digest=//p' "$file")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid $service digest"; exit 1; }
            image="ghcr.io/$NAMESPACE/trademind:$service-sha-$COMMIT"
            docker buildx imagetools inspect "$image@$digest" >/dev/null
            echo "${service}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Publish verification summary
        shell: bash
        run: |
          {
            echo "## Candidate image verification"
            for service in backend admin collector; do
              digest="$(sed -n 's/^digest=//p' "image-metadata/$service.env")"
              echo "- $service: \`$digest\`"
            done
            echo "- All three images passed platform, revision, and vulnerability gates."
          } >> "$GITHUB_STEP_SUMMARY"

  promote_main:
    name: Move main image tags
    needs: [image_metadata, verify]
    if: ${{ needs.image_metadata.outputs.publish_release != 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: trademind-production-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.image_metadata.outputs.commit }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified digests to main tags
        shell: bash
        env:
          NAMESPACE: ${{ needs.image_metadata.outputs.namespace }}
          COMMIT: ${{ needs.image_metadata.outputs.commit }}
          BACKEND_DIGEST: ${{ needs.verify.outputs.backend_digest }}
          ADMIN_DIGEST: ${{ needs.verify.outputs.admin_digest }}
          COLLECTOR_DIGEST: ${{ needs.verify.outputs.collector_digest }}
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$current_main" != "$COMMIT" ]]; then
            echo "::error::Refusing to move main tags for stale commit $COMMIT; current origin/main is $current_main"
            exit 1
          fi
          for service in backend admin collector; do
            case "$service" in
              backend) digest="$BACKEND_DIGEST" ;;
              admin) digest="$ADMIN_DIGEST" ;;
              collector) digest="$COLLECTOR_DIGEST" ;;
            esac
            source="ghcr.io/$NAMESPACE/trademind:$service-sha-$COMMIT@$digest"
            target="ghcr.io/$NAMESPACE/trademind:$service-main"
            docker buildx imagetools create "$source" --tag "$target"
            echo "Promoted $source to $target"
          done

  release:
    name: Create Git tag and GitHub Release
    needs: [image_metadata, verify]
    if: ${{ needs.image_metadata.outputs.publish_release == 'true' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.image_metadata.outputs.version }}
      commit_sha: ${{ needs.image_metadata.outputs.commit }}
      backend_digest: ${{ needs.verify.outputs.backend_digest }}
      admin_digest: ${{ needs.verify.outputs.admin_digest }}
      collector_digest: ${{ needs.verify.outputs.collector_digest }}
    secrets: inherit
