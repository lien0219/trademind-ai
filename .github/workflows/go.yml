name: Go CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "release/**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - dev

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify backend module
        run: |
          if [ ! -d backend ]; then
            echo "::error::CI requires a backend/ directory at the repository root, but it was not found."
            exit 1
          fi
          if [ ! -f backend/go.mod ]; then
            echo "::error::CI requires backend/go.mod to run Go checks, but the file was not found."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Go module download failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Check formatting (gofmt)
        working-directory: backend
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Go files are not formatted. Run go fmt ./... locally and commit the changes."
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: Build
        working-directory: backend
        run: go build ./...

  backend-race:
    name: backend-race
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify backend module
        run: |
          if [ ! -d backend ]; then
            echo "::error::CI requires a backend/ directory at the repository root, but it was not found."
            exit 1
          fi
          if [ ! -f backend/go.mod ]; then
            echo "::error::CI requires backend/go.mod to run Go checks, but the file was not found."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Go module download failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Test
        working-directory: backend
        env:
          CGO_ENABLED: 1
        run: go test ./...

      - name: Race test (Douyin critical packages)
        working-directory: backend
        env:
          CGO_ENABLED: 1
        run: |
          go test -race ./internal/providers/platform/douyinshop/...
          go test -race ./internal/modules/ordersync/...
          go test -race ./internal/modules/inventory/...
          go test -race ./internal/modules/productpublish/...

      - name: Build server
        working-directory: backend
        env:
          CGO_ENABLED: 1
        run: go build ./cmd/server/...

  one-time-gofmt-export:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.event.head_commit.message == 'ci: one-time gofmt export and test correction' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Export only gofmt changes
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          gofmt -w \
            internal/middleware/jwt.go \
            internal/modules/admin/bootstrap.go \
            internal/modules/admin/bootstrap_test.go \
            internal/modules/admin/root.go \
            internal/modules/admin/tenant.go \
            internal/modules/auth/handler.go \
            internal/modules/auth/session_service.go \
            internal/modules/auth/tenant.go \
            internal/modules/auth/tenant_handler.go \
            internal/modules/auth/tenant_test.go \
            internal/modules/tenantmgmt/controlplane.go \
            internal/modules/tenantmgmt/delete.go \
            internal/modules/tenantmgmt/delete_test.go \
            internal/modules/tenantmgmt/handler.go \
            internal/modules/tenantmgmt/service.go \
            internal/pkg/adminperm/context.go \
            internal/pkg/adminperm/platform_authorization.go \
            internal/pkg/adminperm/root.go \
            internal/pkg/adminperm/tenant_scope.go \
            internal/modules/douyinruntime/authorization_test.go
          echo "GOFORMAT_EXPORT_BEGIN"
          git diff --name-only -- internal/ | while IFS= read -r file; do
            printf 'GOFORMAT_FILE_BEGIN:%s\n' "$file"
            base64 -w 0 "$file" | fold -w 120 | sed 's/^/GOFORMAT_CHUNK:/'
            echo "GOFORMAT_FILE_END"
          done
          echo "GOFORMAT_EXPORT_END"
