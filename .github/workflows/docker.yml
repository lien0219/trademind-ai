name: Docker Config CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - dev
    paths:
      - "docker-compose*.yml"
      - "deploy/production/compose.yml"
      - "deploy/scripts/*-production.sh"
      - "deploy/preproduction/compose.yml"
      - "deploy/scripts/*-preproduction.sh"
      - "deploy/scripts/verify-application-images.sh"
      - "deploy/scripts/load-env-defaults.sh"
      - "scripts/preproduction-*.mjs"
      - "tests/workflow/fixtures/preproduction.env"
      - ".env.example"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "deploy/IMAGE_VERSION"
      - "scripts/release/validate-image-version.sh"
      - "scripts/release/validate-release-version.mjs"
      - "scripts/release/release-version.mjs"
      - "scripts/release/validate-production-image-references.sh"
      - ".github/workflows/docker.yml"
      - ".github/workflows/container-images.yml"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "release/**"
    paths:
      - "docker-compose*.yml"
      - "deploy/production/compose.yml"
      - "deploy/scripts/*-production.sh"
      - "deploy/preproduction/compose.yml"
      - "deploy/scripts/*-preproduction.sh"
      - "deploy/scripts/verify-application-images.sh"
      - "deploy/scripts/load-env-defaults.sh"
      - "scripts/preproduction-*.mjs"
      - "tests/workflow/fixtures/preproduction.env"
      - ".env.example"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "deploy/IMAGE_VERSION"
      - "scripts/release/validate-image-version.sh"
      - "scripts/release/validate-release-version.mjs"
      - "scripts/release/release-version.mjs"
      - "scripts/release/validate-production-image-references.sh"
      - ".github/workflows/docker.yml"
      - ".github/workflows/container-images.yml"
      - ".github/workflows/release.yml"

jobs:
  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare env file
        run: cp .env.example .env

      - name: Validate image version
        run: bash scripts/release/validate-image-version.sh >/dev/null

      - name: Validate full compose file
        env:
          # Compose interpolation only; this job validates configuration and starts no services.
          COLLECTOR_SERVICE_TOKEN: ci-compose-validation-token-0123456789abcdef0123456789abcdef
        run: docker compose -f docker-compose.full.yml config

      - name: Validate production image reference policy
        env:
          TRADEMIND_BACKEND_IMAGE: ghcr.io/lien0219/trademind@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRADEMIND_ADMIN_IMAGE: ghcr.io/lien0219/trademind@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          TRADEMIND_COLLECTOR_IMAGE: ghcr.io/lien0219/trademind@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: bash scripts/release/validate-production-image-references.sh

      - name: Validate production deployment configuration
        env:
          POSTGRES_DB: trademind
          POSTGRES_USER: trademind
          POSTGRES_PASSWORD: ci-production-postgres-password
          REDIS_PASSWORD: ci-production-redis-password
          COLLECTOR_SERVICE_TOKEN: ci-production-collector-token-0123456789abcdef0123456789abcdef
          APP_MASTER_KEY: ci-production-master-key-0123456789abcdef0123456789abcdef
          JWT_SECRET: ci-production-jwt-secret-0123456789abcdef0123456789abcdef
          HTTP_TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          METRICS_ALLOWLIST_CIDRS: 127.0.0.1/32
          TRADEMIND_BACKEND_IMAGE: ghcr.io/lien0219/trademind@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRADEMIND_ADMIN_IMAGE: ghcr.io/lien0219/trademind@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          TRADEMIND_COLLECTOR_IMAGE: ghcr.io/lien0219/trademind@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: bash deploy/scripts/deploy-production.sh --dry-run

      - name: Set up Node.js for preproduction preflight
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Validate independent preproduction deployment configuration
        env:
          # Synthetic values for interpolation only. No containers start in this job.
          PREPRODUCTION_DB_PASSWORD: ci-preproduction-db-placeholder
          PREPRODUCTION_REDIS_PASSWORD: ci-preproduction-redis-placeholder
          PREPRODUCTION_APP_MASTER_KEY: ci-preproduction-master-placeholder
          PREPRODUCTION_JWT_SECRET: ci-preproduction-jwt-placeholder
          PREPRODUCTION_COLLECTOR_SERVICE_TOKEN: ci-preproduction-collector-placeholder-0123456789
        run: |
          set -euo pipefail
          printf '\n' >> .env
          cat tests/workflow/fixtures/preproduction.env >> .env
          bash deploy/scripts/deploy-preproduction.sh --dry-run

      - name: Reject a damaged backup before creating a restore database
        run: |
          set -euo pipefail
          dump="$(mktemp)"
          trap 'rm -f -- "$dump" "$dump.sha256" "$dump.original"' EXIT
          printf 'original backup bytes' > "$dump.original"
          sha256sum "$dump.original" > "$dump.sha256"
          printf 'damaged copy' > "$dump"
          docker() { printf 'unexpected Docker access\n' >&2; return 1; }
          export -f docker
          export P10_RESTORE_DATABASE_NAME=trademind_preproduction_restore_ci
          if output="$(bash deploy/scripts/restore-preproduction.sh "$dump" 2>&1)"; then
            echo 'Expected the restore script to reject the damaged dump' >&2
            exit 1
          fi
          [[ "$output" == *"backup checksum mismatch"* && "$output" != *"unexpected Docker access"* ]]
