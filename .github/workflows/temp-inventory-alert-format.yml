name: Temporary Inventory Alert Formatter
on:
  push:
    branches: [dev]
    paths: [.github/workflows/temp-inventory-alert-format.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in backend/internal/modules/inventory/alerts_list.go backend/internal/modules/inventory/alerts_list_test.go; do
            echo "FORMAT_FILE_BEGIN $f"
            gofmt "$f" | base64 -w 0
            echo
            echo "FORMAT_FILE_END $f"
          done
