name: Temporary Tenant Notification Formatter
on:
  push:
    branches: [dev]
    paths: [.github/workflows/temp-tenant-notify-format.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in backend/internal/modules/tenantconfig/service.go backend/internal/modules/taskcenter/service_notify.go backend/internal/modules/taskcenter/service_notify_test.go; do
            echo "FORMAT_FILE_BEGIN $f"
            gofmt "$f" | base64 -w 0
            echo
            echo "FORMAT_FILE_END $f"
          done
