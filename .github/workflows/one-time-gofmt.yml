name: One-time Go formatting remediation
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message == 'ci: apply scoped gofmt remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format precisely the files reported by Go CI
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          gofmt -w \
            internal/middleware/jwt.go \
            internal/modules/admin/bootstrap.go \
            internal/modules/admin/bootstrap_test.go \
            internal/modules/admin/root.go \
            internal/modules/admin/tenant.go \
            internal/modules/auth/handler.go \
            internal/modules/auth/session_service.go \
            internal/modules/auth/tenant.go \
            internal/modules/auth/tenant_handler.go \
            internal/modules/tenantmgmt/controlplane.go \
            internal/modules/tenantmgmt/delete.go \
            internal/modules/tenantmgmt/delete_test.go \
            internal/modules/tenantmgmt/handler.go \
            internal/modules/tenantmgmt/service.go \
            internal/pkg/adminperm/context.go \
            internal/pkg/adminperm/root.go \
            internal/pkg/adminperm/tenant_scope.go
          cd ..
          git diff --check
          git add backend/internal
          if git diff --cached --quiet; then
            echo 'No formatting changes required'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(go): apply gofmt to Root tenant changes'
          git push origin HEAD:dev
