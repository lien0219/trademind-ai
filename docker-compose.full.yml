# TradeMind — Docker 部署启动（PostgreSQL + Redis + backend + admin + collector）
# 使用方式：复制唯一模板 .env.example 为 .env 后执行
#   docker compose -f docker-compose.full.yml up --build
# 请勿与本仓库 docker-compose.yml（仅 infra）混淆；本文件不会删除或修改原有 compose。

name: trademind-full

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trademind}
      POSTGRES_USER: ${POSTGRES_USER:-trademind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trademind_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - trademind_full_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - trademind_full_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    image: ${TRADEMIND_COLLECTOR_IMAGE:-local/trademind-collector:local}
    build:
      context: .
      dockerfile: collector/Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      # Collector only listens on the Compose network and is not published to the host.
      COLLECTOR_HTTP_ADDR: ":3001"
      COLLECTOR_SERVICE_TOKEN: ${COLLECTOR_SERVICE_TOKEN:?COLLECTOR_SERVICE_TOKEN is required}
      COLLECTOR_MAX_REQUEST_BODY_BYTES: ${COLLECTOR_MAX_REQUEST_BODY_BYTES:-1048576}
      COLLECTOR_REQUEST_TIMEOUT_MS: ${COLLECTOR_REQUEST_TIMEOUT_MS:-15000}
      COLLECTOR_HEADERS_TIMEOUT_MS: ${COLLECTOR_HEADERS_TIMEOUT_MS:-10000}
      COLLECTOR_BROWSER_PROFILE_DIR: /workspace/data/browser-profiles
      COLLECTOR_STORAGE_STATE_DIR: /workspace/data/storage-states
      NODE_ENV: production
    expose:
      - "3001"
    volumes:
      - trademind_full_collector_profiles:/workspace/data/browser-profiles
      - trademind_full_collector_storage_states:/workspace/data/storage-states
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:3001/health', (response) => { response.resume(); if (response.statusCode >= 400) process.exitCode = 1; }).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    image: ${TRADEMIND_BACKEND_IMAGE:-local/trademind-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HTTP_ADDR: ":8080"
      HTTP_TRUSTED_PROXY_CIDRS: ${HTTP_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      METRICS_ALLOWLIST_CIDRS: ${METRICS_ALLOWLIST_CIDRS:-127.0.0.1/32,::1/128}
      DB_HOST: postgres
      REDIS_ADDR: redis:6379
      COLLECTOR_BASE_URL: http://collector:3001
      COLLECTOR_SERVICE_TOKEN: ${COLLECTOR_SERVICE_TOKEN:?COLLECTOR_SERVICE_TOKEN is required}
      DOUYIN_WEBHOOK_TEST_SHOP_BINDING_ID: ${DOUYIN_WEBHOOK_TEST_SHOP_BINDING_ID:-}
      ENABLE_DOUYIN_WEBHOOK_DEMO_FALLBACK: ${ENABLE_DOUYIN_WEBHOOK_DEMO_FALLBACK:-false}
      P7_DIAGNOSTICS_ENABLED: ${P7_DIAGNOSTICS_ENABLED:-false}
      P7_DIAGNOSTIC_RUN_ID: ${P7_DIAGNOSTIC_RUN_ID:-}
      P7_DIAGNOSTIC_ROLE: ${P7_DIAGNOSTIC_ROLE:-}
      P7_DIAGNOSTIC_DIR: ${P7_DIAGNOSTIC_DIR:-artifacts/p7-v2-diagnostics}
      P7_DIAGNOSTIC_BUFFER: ${P7_DIAGNOSTIC_BUFFER:-4096}
      P7_DIAGNOSTIC_RUNTIME_SNAPSHOT_INTERVAL_MS: ${P7_DIAGNOSTIC_RUNTIME_SNAPSHOT_INTERVAL_MS:-1000}
      P10_CURRENT_ALLOWED_LEVEL: ${P10_CURRENT_ALLOWED_LEVEL:-L0}
      P10_OFFLINE_OAUTH_ENABLED: ${P10_OFFLINE_OAUTH_ENABLED:-false}
      P10_LOCAL_CREDENTIAL_KEY: ${P10_LOCAL_CREDENTIAL_KEY:-}
      P10_LOCAL_CREDENTIAL_KEY_REF: ${P10_LOCAL_CREDENTIAL_KEY_REF:-local-development-v1}
      P10_OAUTH_STATE_TTL_SECONDS: ${P10_OAUTH_STATE_TTL_SECONDS:-600}
      P10_OAUTH_REDIRECT_ALLOWLIST: ${P10_OAUTH_REDIRECT_ALLOWLIST:-}
      P10_DOUYIN_API_BASE_URL: ${P10_DOUYIN_API_BASE_URL:-}
      P10_PROVIDER_REQUEST_TIMEOUT_SECONDS: ${P10_PROVIDER_REQUEST_TIMEOUT_SECONDS:-30}
      P10_PROVIDER_CONNECT_TIMEOUT_SECONDS: ${P10_PROVIDER_CONNECT_TIMEOUT_SECONDS:-5}
      P10_PROVIDER_RESPONSE_HEADER_TIMEOUT_SECONDS: ${P10_PROVIDER_RESPONSE_HEADER_TIMEOUT_SECONDS:-15}
      P10_PROVIDER_MAX_RESPONSE_BYTES: ${P10_PROVIDER_MAX_RESPONSE_BYTES:-2097152}
      P10_PROVIDER_CONCURRENCY: ${P10_PROVIDER_CONCURRENCY:-2}
      P10_SKU_PAGE_SIZE: ${P10_SKU_PAGE_SIZE:-50}
      P10_PAGINATION_LIMIT: ${P10_PAGINATION_LIMIT:-100}
      P10_REAL_PROVIDER_ENABLED: ${P10_REAL_PROVIDER_ENABLED:-false}
      P10_REAL_PLATFORM_NETWORK_ENABLED: ${P10_REAL_PLATFORM_NETWORK_ENABLED:-false}
      P10_REAL_CREDENTIALS_ENABLED: ${P10_REAL_CREDENTIALS_ENABLED:-false}
      P10_REAL_INVENTORY_READ_ENABLED: ${P10_REAL_INVENTORY_READ_ENABLED:-false}
      P10_REAL_PRODUCT_DRAFT_WRITE_ENABLED: ${P10_REAL_PRODUCT_DRAFT_WRITE_ENABLED:-false}
      P10_INVENTORY_MUTATION_ENABLED: ${P10_INVENTORY_MUTATION_ENABLED:-false}
      P10_BACKGROUND_WORKER_ENABLED: ${P10_BACKGROUND_WORKER_ENABLED:-false}
      P10_AUTOMATIC_RETRY_ENABLED: ${P10_AUTOMATIC_RETRY_ENABLED:-false}
    ports:
      - "${BACKEND_PUBLISH_PORT:-8080}:8080"
    volumes:
      - trademind_full_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      collector:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  admin:
    image: ${TRADEMIND_ADMIN_IMAGE:-local/trademind-admin:local}
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    ports:
      - "${ADMIN_PUBLISH_PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  trademind_full_pg_data:
  trademind_full_redis_data:
  trademind_full_uploads:
  trademind_full_collector_profiles:
  trademind_full_collector_storage_states:
